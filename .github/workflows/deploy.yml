name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DIST_DIR: dist
      CACHE_CONTROL: max-age=604800
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build-prod

      - name: Resolve deploy settings
        id: deploy-settings
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_IDS: ${{ vars.CLOUDFRONT_DISTRIBUTION_IDS }}
        run: |
          echo "aws-region=${AWS_REGION:-eu-west-1}" >> "$GITHUB_OUTPUT"
          echo "S3_BUCKET=${S3_BUCKET:-mtbmaps.net}" >> "$GITHUB_ENV"
          {
            echo "CLOUDFRONT_DISTRIBUTION_IDS<<EOF"
            echo "${CLOUDFRONT_DISTRIBUTION_IDS:-E1XAG5EBVMQWWB E32C96K56BB5FT}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.deploy-settings.outputs.aws-region }}

      - name: Deploy to S3 and invalidate CloudFront
        run: bash stage_and_deploy.sh
